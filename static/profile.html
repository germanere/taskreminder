<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ sơ — Market Research Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0: #f4f6f9;
  --bg1: #ffffff;
  --bg2: #f1f4f8;
  --bg3: #e7ebf1;
  --border: #e3e8ef;
  --border2: #d6dce5;
  --text0: #0f172a;
  --text1: #33415c;
  --text2: #64748b;
  --text3: #94a3b8;
  --green:  #0f9d58;
  --green2: #e3f6ea;
  --red:    #d93025;
  --red2:   #fbe8e6;
  --yellow: #b7791f;
  --yellow2:#fdf1dc;
  --black:  #111111;
  --font: -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 2px 10px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
}

html, body {
  min-height: 100%;
  background: var(--bg0);
  color: var(--text1);
  font-family: var(--font);
  font-size: 13px;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 48px;
  padding: 0 20px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 0;
  z-index: 100;
}
.back-btn {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text2);
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: background .15s;
}
.back-btn:hover { background: var(--border2); color: var(--text0); }
.header-title { font-size: 15px; font-weight: 700; color: var(--text0); }

.main {
  max-width: 560px;
  margin: 0 auto;
  padding: 28px 20px;
}

.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text3);
  gap: 10px;
}
.spinner {
  width: 26px; height: 26px;
  border: 2px solid var(--bg3);
  border-top-color: var(--black);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.profile-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 24px;
  display: none;
}
.profile-card.show { display: block; }

.avatar-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}
.avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--black);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 700;
  flex-shrink: 0;
}
.avatar-email { font-size: 15px; font-weight: 600; color: var(--text0); word-break: break-all; }
.role-badge {
  display: inline-block;
  margin-top: 4px;
  padding: 2px 9px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.role-badge.free_tier { background: var(--bg3); color: var(--text2); }
.role-badge.premium   { background: var(--yellow2); color: var(--yellow); }
.role-badge.admin     { background: var(--red2); color: var(--red); }

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.stat-box {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 14px;
}
.stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.stat-val { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--text0); }

.info-list { display: flex; flex-direction: column; gap: 0; margin-bottom: 20px; }
.info-row {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
}
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--text3); }
.info-val { color: var(--text1); font-family: var(--font-mono); }

.upgrade-note {
  background: var(--bg2);
  border-left: 3px solid var(--black);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 20px;
}

.btn-logout {
  width: 100%;
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--red);
  padding: 9px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-logout:hover { background: var(--red2); }

.error-state {
  display: none;
  text-align: center;
  padding: 40px 20px;
  color: var(--text3);
}
.error-state.show { display: block; }
.error-state a { color: var(--black); font-weight: 600; }
</style>
</head>
<body>

<header class="header">
  <a href="/" class="back-btn">← Về trang chủ</a>
  <span class="header-title">Hồ sơ của bạn</span>
</header>

<div class="main">

  <div class="loading-state" id="loading">
    <div class="spinner"></div>
    <div>Đang tải thông tin...</div>
  </div>

  <div class="profile-card" id="profile-card">
    <div class="avatar-row">
      <div class="avatar" id="avatar-letter">?</div>
      <div>
        <div class="avatar-email" id="p-email">--</div>
        <span class="role-badge" id="p-role-badge">--</span>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-label">Credit còn lại</div>
        <div class="stat-val" id="p-credits">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Gói hiện tại</div>
        <div class="stat-val" id="p-role" style="font-size:16px">--</div>
      </div>
    </div>

    <div class="info-list">
      <div class="info-row">
        <span class="info-label">Tham gia từ</span>
        <span class="info-val" id="p-created">--</span>
      </div>
    </div>

    <div class="upgrade-note" id="upgrade-note" style="display:none">
      Bạn đang dùng gói miễn phí — mỗi lượt phân tích cổ phiếu tốn 1 credit. Liên hệ để nâng cấp premium (không giới hạn lượt).
    </div>

    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
  </div>

  <div class="error-state" id="error-state">
    <div id="error-msg">Chưa đăng nhập.</div>
    <div style="margin-top:10px"><a href="/login.html">Đến trang đăng nhập</a></div>
  </div>

</div>

<script>
const API = "";

const ROLE_LABELS = { free_tier: "Miễn phí", premium: "Premium", admin: "Admin" };

function logout() {
  localStorage.removeItem("mh_access_token");
  localStorage.removeItem("mh_refresh_token");
  localStorage.removeItem("mh_user_email");
  location.href = "/login.html";
}

async function loadProfile() {
  const token = localStorage.getItem("mh_access_token");
  const loading = document.getElementById("loading");
  const card = document.getElementById("profile-card");
  const errBox = document.getElementById("error-state");

  if (!token) {
    loading.style.display = "none";
    document.getElementById("error-msg").textContent = "Bạn chưa đăng nhập.";
    errBox.classList.add("show");
    return;
  }

  try {
    const res = await fetch(`${API}/api/auth/me`, {
      headers: { "Authorization": `Bearer ${token}` },
    });
    const data = await res.json();

    if (res.status === 401) {
      logout();
      return;
    }
    if (!res.ok) {
      loading.style.display = "none";
      document.getElementById("error-msg").textContent = data.error || "Không tải được hồ sơ.";
      errBox.classList.add("show");
      return;
    }

    document.getElementById("avatar-letter").textContent = (data.email || "?")[0].toUpperCase();
    document.getElementById("p-email").textContent = data.email;
    document.getElementById("p-credits").textContent = data.role === "free_tier" ? data.credits : "∞";
    document.getElementById("p-role").textContent = ROLE_LABELS[data.role] || data.role;

    const badge = document.getElementById("p-role-badge");
    badge.textContent = ROLE_LABELS[data.role] || data.role;
    badge.className = `role-badge ${data.role}`;

    if (data.created_at) {
      const d = new Date(data.created_at);
      document.getElementById("p-created").textContent = d.toLocaleDateString("vi-VN");
    }

    if (data.role === "free_tier") {
      document.getElementById("upgrade-note").style.display = "block";
    }

    loading.style.display = "none";
    card.classList.add("show");
  } catch (e) {
    loading.style.display = "none";
    document.getElementById("error-msg").textContent = "Không thể kết nối server: " + e.message;
    errBox.classList.add("show");
  }
}

loadProfile();
</script>

</body>
</html>
