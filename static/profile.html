<!-- ============================================================
     HEADER USER INFO — chỉ hiện avatar + email khi đã đăng nhập.
     Không dropdown, không logout (logout đã có sẵn ở /profile.html).
     Dán vào <header> của trang chủ / trang phân tích...
     ============================================================ -->

<!-- 1. CSS -->
<style>
.header-user { display: none; align-items: center; gap: 8px; margin-left: auto; }
.header-user.show { display: flex; }

.hu-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--black);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
}
.hu-email {
  font-size: 12.5px;
  color: var(--text1);
  max-width: 160px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hu-logout {
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  background: var(--bg1);
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s;
}
.hu-logout:hover { background: var(--red2); }
</style>

<!-- 2. HTML: đặt trong <header class="header">, sau các phần tử khác -->
<div class="header-user" id="header-user">
  <span class="hu-avatar" id="hu-avatar">?</span>
  <span class="hu-email" id="hu-email">--</span>
  <button class="hu-logout" id="hu-logout">Đăng xuất</button>
</div>

<script>
/* ============================================================
   3. JS: tự chạy khi DOM load xong, lấy thông tin từ /api/auth/me
   ============================================================ */
document.addEventListener("DOMContentLoaded", async () => {
  const token = localStorage.getItem("mh_access_token");
  const wrap = document.getElementById("header-user");
  if (!wrap || !token) return;

  try {
    const res = await fetch("/api/auth/me", {
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) return;

    const data = await res.json();
    document.getElementById("hu-avatar").textContent = (data.email || "?")[0].toUpperCase();
    document.getElementById("hu-email").textContent = data.email;
    wrap.classList.add("show");
  } catch (e) {
    console.warn("Không tải được thông tin user:", e);
  }

  document.getElementById("hu-logout").addEventListener("click", () => {
    localStorage.removeItem("mh_access_token");
    localStorage.removeItem("mh_refresh_token");
    localStorage.removeItem("mh_user_email");
    location.href = "/login.html";
  });
});
</script>
