<!DOCTYPE html>
<html lang="vi">
<head>
<script src="/static/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top mua ròng / bán ròng — Market Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0: #f4f6f9;
  --bg1: #ffffff;
  --bg2: #f1f4f8;
  --bg3: #e7ebf1;
  --bg4: #d3dae3;
  --border: #e3e8ef;
  --border2: #d6dce5;
  --text0: #0f172a;
  --text1: #33415c;
  --text2: #64748b;
  --text3: #94a3b8;
  --green:  #0f9d58;
  --green2: #e3f6ea;
  --red:    #d93025;
  --red2:   #fbe8e6;
  --yellow: #b7791f;
  --blue:   #111111;
  --blue2:  #e5e5e5;
  --font: -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 2px 10px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
}

html, body {
  min-height: 100%;
  background: var(--bg0);
  color: var(--text1);
  font-family: var(--font);
  font-size: 13px;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg1); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 48px;
  padding: 0 20px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 0;
  z-index: 100;
}
.back-btn {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text2);
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: background .15s;
}
.back-btn:hover { background: var(--bg4); color: var(--text0); }
.header-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text0);
}
.header-sub {
  font-size: 11px;
  color: var(--text3);
}
.header-refresh {
  margin-left: auto;
  background: var(--blue);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.header-refresh:hover { opacity: .85; }
.header-refresh:disabled { opacity: .4; cursor: default; }

/* ===== User info (avatar + email + logout) ===== */
.header-user {
  display: none;
  align-items: center;
  gap: 8px;
}
.header-user.show { display: flex; }
.hu-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
}
.hu-email {
  font-size: 12.5px;
  color: var(--text1);
  max-width: 160px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hu-logout {
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  background: var(--bg2);
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s;
}
.hu-logout:hover { background: var(--red2); }

.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
}

.disclaimer {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
  margin-bottom: 16px;
  padding: 12px 14px;
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  border-left: 3px solid var(--yellow);
}
.disclaimer.real { border-left-color: var(--green); }
.disclaimer b { color: var(--text0); }

.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 760px) {
  .cols { grid-template-columns: 1fr; }
}

.panel {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  font-size: 13px;
}
.panel-head.buy  { color: var(--green); }
.panel-head.sell { color: var(--red); }
.panel-dot { width: 7px; height: 7px; border-radius: 50%; }
.panel-dot.buy  { background: var(--green); }
.panel-dot.sell { background: var(--red); }

table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .05em;
  padding: 8px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th.num { text-align: right; }
tbody tr {
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--bg2); }
tbody td { padding: 9px 12px; font-size: 12px; vertical-align: middle; }
tbody td.num { text-align: right; font-family: var(--font-mono); }

.rank { font-family: var(--font-mono); color: var(--text3); width: 24px; }
.sym-cell { display: flex; flex-direction: column; gap: 1px; }
.sym-code { font-family: var(--font-mono); font-weight: 700; color: var(--text0); font-size: 12.5px; }
.sym-name { font-size: 10px; color: var(--text3); }

.flow-val.buy  { color: var(--green); font-weight: 600; }
.flow-val.sell { color: var(--red);   font-weight: 600; }
.pct-pos { color: var(--green); }
.pct-neg { color: var(--red); }

.loading-state, .empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 50px 16px;
  color: var(--text3);
  text-align: center;
  gap: 10px;
}
.spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--bg3);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .main { padding: 12px; }
  .hu-email { max-width: 90px; }
}
</style>
</head>
<body>

<header class="header">
  <a href="/" class="back-btn">← Về trang chủ</a>
  <div>
    <div class="header-title">Top mua ròng / bán ròng</div>
    <div class="header-sub" id="hdr-sub">Đang tải...</div>
  </div>
  <button class="header-refresh" id="btn-refresh" onclick="loadData()">Làm mới</button>

  <div class="header-user" id="header-user">
    <span class="hu-avatar" id="hu-avatar">?</span>
    <span class="hu-email" id="hu-email">--</span>
    <button class="hu-logout" id="hu-logout">Đăng xuất</button>
  </div>
</header>

<div class="main">

  <div class="disclaimer" id="disclaimer">Đang tải...</div>

  <div class="cols">
    <div class="panel">
      <div class="panel-head buy"><span class="panel-dot buy"></span> Top 15 mua ròng</div>
      <div id="buy-wrap">
        <div class="loading-state"><div class="spinner"></div><div>Đang quét dữ liệu HOSE...</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head sell"><span class="panel-dot sell"></span> Top 15 bán ròng</div>
      <div id="sell-wrap">
        <div class="loading-state"><div class="spinner"></div><div>Đang quét dữ liệu HOSE...</div></div>
      </div>
    </div>
  </div>

</div>

<script>
const API = "";
const fmtNum = (n, d=2) => (n == null || isNaN(n)) ? "--" : Number(n).toLocaleString("vi-VN", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtPct = (n) => n == null ? "--" : (n>=0?"+":"") + Number(n).toFixed(2) + "%";

function fmtFlow(vnd) {
  const abs = Math.abs(vnd);
  const sign = vnd >= 0 ? "+" : "-";
  if (abs >= 1e9) return sign + (abs/1e9).toFixed(1) + " tỷ";
  if (abs >= 1e6) return sign + (abs/1e6).toFixed(0) + " tr";
  return sign + fmtNum(abs, 0);
}

function renderTable(rows, kind) {
  if (!rows || rows.length === 0) {
    return `<div class="empty-state">Chưa có dữ liệu</div>`;
  }
  const body = rows.map((r, i) => `
    <tr onclick="location.href='/analysis.html?sym=${r.symbol}'">
      <td class="rank">${i + 1}</td>
      <td>
        <div class="sym-cell">
          <span class="sym-code">${r.symbol}</span>
          <span class="sym-name">${r.name || ""}</span>
        </div>
      </td>
      <td class="num">${fmtNum(r.price, 2)}</td>
      <td class="num ${r.price_change_month >= 0 ? "pct-pos" : "pct-neg"}">${fmtPct(r.price_change_month)}</td>
      <td class="num flow-val ${kind}">${fmtFlow(r.net_flow_vnd)}</td>
    </tr>
  `).join("");

  return `
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Mã</th>
          <th class="num">Giá</th>
          <th class="num">Tháng</th>
          <th class="num">Dòng tiền</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
  `;
}

async function loadData() {
  const btn = document.getElementById("btn-refresh");
  const sub = document.getElementById("hdr-sub");
  btn.disabled = true;
  btn.textContent = "Đang quét...";
  sub.textContent = "Đang quét toàn bộ mã HOSE (có thể mất khoảng nửa phút lần đầu)...";

  document.getElementById("buy-wrap").innerHTML =
    `<div class="loading-state"><div class="spinner"></div><div>Đang tải...</div></div>`;
  document.getElementById("sell-wrap").innerHTML =
    `<div class="loading-state"><div class="spinner"></div><div>Đang tải...</div></div>`;

  try {
    const res = await fetch(`${API}/api/vn/net-flow-month?limit=15`);
    const data = await res.json();

    if (data.error) {
      document.getElementById("buy-wrap").innerHTML = `<div class="empty-state">${data.error}</div>`;
      document.getElementById("sell-wrap").innerHTML = "";
      sub.textContent = "Lỗi tải dữ liệu";
      return;
    }

    document.getElementById("buy-wrap").innerHTML = renderTable(data.top_buy, "buy");
    document.getElementById("sell-wrap").innerHTML = renderTable(data.top_sell, "sell");
    sub.textContent = `Cập nhật mỗi 4 giờ — ${(data.top_buy?.length || 0) + (data.top_sell?.length || 0)} mã hiển thị`;

    const dEl = document.getElementById("disclaimer");
    dEl.className = "disclaimer" + (data.is_real ? " real" : "");
    dEl.innerHTML = data.is_real
      ? `✅ <b>Dữ liệu khối ngoại THẬT</b> từ SSI FastConnect Data API — mua ròng/bán ròng theo giá trị giao dịch thực tế của nhà đầu tư nước ngoài trong 1 tháng gần nhất. Chỉ mang tính tham khảo, không phải khuyến nghị đầu tư.`
      : `⚠️ <b>Đây là số liệu ƯỚC TÍNH</b> từ giá + khối lượng khớp lệnh (kiểu dòng tiền kỹ thuật, tương tự OBV/Chaikin Money Flow) — <b>không phải</b> dữ liệu giao dịch khối ngoại thật, vì server chưa cấu hình SSI FastConnect API. Chỉ mang tính tham khảo, không phải khuyến nghị đầu tư.`;
  } catch (e) {
    document.getElementById("buy-wrap").innerHTML =
      `<div class="empty-state">Không thể kết nối server: ${e.message}</div>`;
    document.getElementById("sell-wrap").innerHTML = "";
    sub.textContent = "Lỗi kết nối";
  } finally {
    btn.disabled = false;
    btn.textContent = "Làm mới";
  }
}

/* ===== User info header ===== */
async function initHeaderUser() {
  const token = localStorage.getItem("mh_access_token");
  const wrap = document.getElementById("header-user");
  if (!token) return;

  try {
    const res = await fetch("/api/auth/me", {
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) return;

    const data = await res.json();
    document.getElementById("hu-avatar").textContent = (data.email || "?")[0].toUpperCase();
    document.getElementById("hu-email").textContent = data.email;
    wrap.classList.add("show");
  } catch (e) {
    console.warn("Không tải được thông tin user:", e);
  }
}

document.getElementById("hu-logout").addEventListener("click", () => {
  localStorage.removeItem("mh_access_token");
  localStorage.removeItem("mh_refresh_token");
  localStorage.removeItem("mh_user_email");
  location.href = "/login.html";
});

loadData();
initHeaderUser();
</script>

</body>
</html>
