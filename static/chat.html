<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant — Market Research Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #13161e;
    --border:    #1e2330;
    --border2:   #252b3b;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --accent:    #3b82f6;
    --accent2:   #1d4ed8;
    --green:     #22c55e;
    --red:       #ef4444;
    --user-bg:   #1e2a45;
    --bot-bg:    #13161e;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Inter', sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    transition: all .15s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--border2); }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: .4; }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: var(--sans);
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: all .15s;
  }
  .clear-btn:hover { border-color: var(--red); color: var(--red); }

  /* ── SUGGESTED CHIPS ── */
  .chips-bar {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    overflow-x: auto;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .chips-bar::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-family: var(--sans);
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* ── MESSAGES ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .msg-row {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    align-items: flex-start;
  }
  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    margin-top: 2px;
  }
  .avatar.bot  { background: var(--accent2); color: #fff; }
  .avatar.user { background: #1e3a5f; color: var(--accent); }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.65;
    word-break: break-word;
  }
  .bubble.bot  {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 2px;
    color: var(--text);
  }
  .bubble.user {
    background: var(--user-bg);
    border: 1px solid #2a3f6b;
    border-top-right-radius: 2px;
    color: var(--text);
  }

  /* Markdown-ish styling inside bubbles */
  .bubble strong { color: #93c5fd; font-weight: 600; }
  .bubble em     { color: #a5b4fc; }
  .bubble code   {
    font-family: var(--mono);
    font-size: 12px;
    background: #0d1220;
    border: 1px solid var(--border2);
    padding: 1px 5px;
    border-radius: 3px;
    color: #86efac;
  }
  .bubble pre {
    background: #0a0d16;
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 12px;
  }
  .bubble ul, .bubble ol {
    padding-left: 18px;
    margin: 6px 0;
  }
  .bubble li { margin: 3px 0; }
  .bubble p  { margin: 4px 0; }
  .bubble h3 { font-size: 14px; font-weight: 600; margin: 8px 0 4px; color: #93c5fd; }

  /* number/price highlight */
  .num-up   { color: var(--green); font-family: var(--mono); font-size: 13px; }
  .num-down { color: var(--red);   font-family: var(--mono); font-size: 13px; }
  .num      { color: #f0abfc;      font-family: var(--mono); font-size: 13px; }

  /* Typing indicator */
  .typing-dots {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 14px;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: dot-bounce .9s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .30s; }
  @keyframes dot-bounce {
    0%,80%,100% { transform: translateY(0); opacity: .4; }
    40%          { transform: translateY(-5px); opacity: 1; }
  }

  /* ── WELCOME ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 16px;
    text-align: center;
    padding: 40px 20px;
  }
  .welcome-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #1d4ed8, #7c3aed);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 30px #1d4ed840;
  }
  .welcome h2  { font-size: 20px; font-weight: 600; }
  .welcome p   { color: var(--muted); font-size: 14px; max-width: 360px; line-height: 1.6; }

  /* ── INPUT AREA ── */
  .input-area {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 20px 16px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 8px 12px;
    transition: border-color .15s;
  }
  .input-row:focus-within { border-color: var(--accent); }

  #userInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    scrollbar-width: thin;
  }
  #userInput::placeholder { color: var(--muted); }

  #sendBtn {
    width: 34px; height: 34px;
    border-radius: 7px;
    background: var(--accent);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  #sendBtn:hover    { background: var(--accent2); }
  #sendBtn:disabled { background: var(--border2); cursor: not-allowed; }

  .input-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .bubble { max-width: 90%; }
    header  { padding: 0 12px; }
    #messages, .chips-bar, .input-area { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <a href="/" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Dashboard
    </a>
    <div class="logo">
      <div class="logo-dot"></div>
      AI Assistant
    </div>
  </div>
  <div class="header-right">
    <button class="clear-btn" onclick="clearChat()">Xóa hội thoại</button>
  </div>
</header>

<!-- SUGGESTED CHIPS -->
<div class="chips-bar" id="chipsBar">
  <button class="chip" onclick="sendChip(this)">📈 BTC đang ở vùng nào?</button>
  <button class="chip" onclick="sendChip(this)">💰 Vàng SJC hôm nay bao nhiêu?</button>
  <button class="chip" onclick="sendChip(this)">💱 Tỷ giá USD/VND?</button>
  <button class="chip" onclick="sendChip(this)">📊 Phân tích ETH</button>
  <button class="chip" onclick="sendChip(this)">🔍 Fear & Greed Index là gì?</button>
  <button class="chip" onclick="sendChip(this)">📉 RSI và MACD khác nhau thế nào?</button>
  <button class="chip" onclick="sendChip(this)">🏦 Cổ phiếu VN-Index</button>
  <button class="chip" onclick="sendChip(this)">⚡ DCA là gì?</button>
</div>

<!-- MESSAGES -->
<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🤖</div>
    <h2>Trợ lý Market Research</h2>
    <p>Hỏi tôi về crypto, ngoại hối, vàng, chứng khoán Việt Nam, hoặc bất kỳ câu hỏi nào về tài chính & ứng dụng này.</p>
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-row">
    <textarea id="userInput" rows="1" placeholder="Hỏi về BTC, ETH, vàng, USD/VND, cổ phiếu..."></textarea>
    <button id="sendBtn" onclick="sendMessage()" title="Gửi (Enter)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="input-hint">Enter gửi · Shift+Enter xuống dòng</div>
</div>

<script>
const SYSTEM_PROMPT = `Bạn là trợ lý AI chuyên về tài chính và thị trường, tích hợp trong Market Research Hub — một ứng dụng theo dõi thị trường real-time gồm:
- Crypto: BTC, ETH, SOL, BNB, XRP và top 200 coin (dữ liệu từ Bybit + CoinGecko)
- Ngoại hối: USD/VND, EUR/VND, JPY/VND, CNY/VND (Vietcombank)
- Vàng SJC (tính từ XAU/USD Yahoo Finance × tỷ giá VCB × 1.08)
- Chứng khoán Việt Nam: VNM, FPT, VCB, HPG, MWG, TCB, VIC, VHM (Yahoo Finance)
- Fear & Greed Index, lịch kinh tế

Phong cách trả lời:
- Ngắn gọn, súc tích, dùng tiếng Việt
- Dùng số liệu cụ thể khi có thể
- Dùng emoji phù hợp (📈 📉 💰 ⚠️)
- Với câu hỏi phân tích kỹ thuật: giải thích rõ ràng cho người mới
- Luôn thêm disclaimer ngắn khi đưa ra nhận định đầu tư
- KHÔNG bịa số liệu giá cụ thể theo thời gian thực — hãy hướng dẫn user xem trực tiếp trên dashboard`;

let history = [];
let isLoading = false;

const messagesEl  = document.getElementById('messages');
const inputEl     = document.getElementById('userInput');
const sendBtnEl   = document.getElementById('sendBtn');
const welcomeEl   = document.getElementById('welcome');
const chipsBarEl  = document.getElementById('chipsBar');

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendChip(btn) {
  const text = btn.textContent.replace(/^[^\s]+\s/, '').trim(); // strip emoji
  inputEl.value = btn.textContent.trim();
  sendMessage();
}

function clearChat() {
  history = [];
  messagesEl.innerHTML = '';
  messagesEl.appendChild(welcomeEl);
  welcomeEl.style.display = 'flex';
  chipsBarEl.style.display = 'flex';
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendMessage(role, html) {
  // Hide welcome on first message
  if (welcomeEl.parentNode) {
    welcomeEl.style.display = 'none';
    chipsBarEl.style.display = 'none';
  }

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'bot' ? 'AI' : 'U';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = html;

  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typing-row';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble bot';
  bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;

  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

// Simple markdown → HTML
function mdToHtml(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // code blocks
    .replace(/```[\w]*\n?([\s\S]*?)```/g, (_, c) => `<pre><code>${c.trim()}</code></pre>`)
    // inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // headings
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    // bullet lists
    .replace(/^[-•] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    // numbered lists
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // line breaks → paragraphs
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>')
    // wrap in p if not already block
    .replace(/^(?!<[hup])(.+)/, '<p>$1</p>');
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtnEl.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Show user message
  appendMessage('user', mdToHtml(text));

  // Add to history
  history.push({ role: 'user', content: text });

  // Show typing
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history,
      }),
    });

    const data = await response.json();
    removeTyping();

    const reply = data.content?.map(b => b.text || '').join('') || 'Xin lỗi, có lỗi xảy ra.';

    // Add to history
    history.push({ role: 'assistant', content: reply });

    // Keep history manageable (last 20 turns)
    if (history.length > 40) history = history.slice(-40);

    appendMessage('bot', mdToHtml(reply));

  } catch (err) {
    removeTyping();
    appendMessage('bot', `<span style="color:var(--red)">⚠️ Lỗi kết nối: ${err.message}</span>`);
  }

  isLoading = false;
  sendBtnEl.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
